name: Release
run-name: Release · ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version like 0.4.0-r1 (Makefiles must already be bumped)'
        required: true

permissions:
  contents: write

concurrency:
  # Manual versions (with or without v) share the tag push's lock.
  group: release-${{ (startsWith(inputs.version, 'v') && inputs.version) || (inputs.version && format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

env:
  REPO: REALalphas/nadkop

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      base_url: ${{ steps.v.outputs.base_url }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VER="${RAW#v}"
          if ! printf '%s\n' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$'; then
            echo '::error::Expected a release version X.Y.Z-rN.'
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "base_url=https://github.com/${{ env.REPO }}/releases/download/v${VER}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          # A queued tag run must use the triggering commit if the tag moves.
          ref: ${{ github.event_name == 'push' && github.sha || format('v{0}', steps.v.outputs.ver) }}
      - name: Pin release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          # No external Go dependencies, so there is no go.sum to hash.
          cache: false
      - name: Verify release candidate
        env:
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -eu
          ui="$(awk -F':=' '/^PKG_VERSION:=/{v=$2} /^PKG_RELEASE:=/{r=$2} END{printf "%s-r%s", v, r}' openwrt/luci-app-nadkop/Makefile)"
          test "$VER" = "$ui" || { echo '::error::Release tag must match the LuCI package version.'; exit 1; }
          bash scripts/bump-version.sh --check
          go vet ./...
          go test ./...
          go build -o build/nadkop ./cmd/nadkop
          ./build/nadkop validate -config examples/config.json
          test -z "$(gofmt -l cmd internal)"
          python3 - "$VER" <<'PY'
          import re, sys
          ver = sys.argv[1]
          lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          heading = re.compile(r'^## .*LuCI ' + re.escape(ver) + r'(?:\s|$)')
          start = next((i for i, line in enumerate(lines) if heading.search(line)), None)
          if start is None:
              sys.exit('Missing release changelog section')
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          if 'TODO: describe' in '\n'.join(lines[start:end]):
              sys.exit('Unfinished release changelog section')
          PY
          python3 scripts/test-release.py

  build-go:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          # No external Go dependencies, so there is no go.sum to hash.
          cache: false
      - run: bash scripts/bump-version.sh --check
      - run: |
          mkdir -p dist/host
          GOOS=linux GOARCH=amd64 go build -o dist/host/nadkop-linux-x86_64 ./cmd/nadkop
          GOOS=linux GOARCH=arm64 go build -o dist/host/nadkop-linux-aarch64 ./cmd/nadkop
      - uses: actions/upload-artifact@v7
        with:
          name: host-${{ needs.version.outputs.ver }}
          path: dist/host/

  build-openwrt:
    needs: version
    uses: ./.github/workflows/openwrt.yml
    with:
      source_ref: ${{ needs.version.outputs.sha }}
      artifact_suffix: ${{ needs.version.outputs.ver }}

  publish:
    needs: [version, build-go, build-openwrt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Assemble release layout
        env:
          VER: ${{ needs.version.outputs.ver }}
          BASE_URL: ${{ needs.version.outputs.base_url }}
        run: |
          set -eu
          mkdir -p release/
          cp artifacts/host-*/nadkop-linux-* release/
          # Collect packages; disambiguate arch-specific APK names per arch
          # (upstream names collide). The arch-independent LuCI package
          # (LUCI_PKGARCH=all) is identical for every target: copy once.
          for combo in apk-x86_64 apk-aarch64 ipk-x86_64 ipk-aarch64; do
            arch="${combo##*-}"
            for p in artifacts/owrt-"$combo"-*/*.apk artifacts/owrt-"$combo"-*/*.ipk; do
              [ -e "$p" ] || continue
              case "$p" in
                *luci-app-nadkop*.apk) cp "$p" release/ ;;
                *.apk) cp "$p" "release/$(basename "$p" .apk)-${arch}.apk" ;;
                # Use the machine arch in asset names, as get-nadkop.sh does.
                # The package's internal OpenWrt ABI arch stays unchanged.
                *.ipk)
                  name="$(basename "$p" .ipk)"
                  package="${name%%_*}"; version_arch="${name#*_}"
                  version="${version_arch%%_*}"
                  # opkg SDKs use -N; APK and our release pins use -rN.
                  version="$(printf '%s\n' "$version" | sed -E 's/-([0-9]+)$/-r\1/')"
                  package_arch="$arch"
                  [ "$package" != luci-app-nadkop ] || package_arch=all
                  cp "$p" "release/${package}_${version}_${package_arch}.ipk" ;;
              esac
            done
          done
          cp scripts/install-openwrt.sh release/
          python3 - "$VER" "$BASE_URL" <<'PY'
          import re, sys
          ver, base = sys.argv[1], sys.argv[2]
          core = ui = ver
          m = re.search(r'^PKG_VERSION:=(\S+)\s*$', open('openwrt/nadkop/Makefile').read(), re.M)
          if m: core = m.group(1) + '-r' + re.search(r'^PKG_RELEASE:=(\S+)\s*$', open('openwrt/nadkop/Makefile').read(), re.M).group(1)
          m = re.search(r'^PKG_VERSION:=(\S+)\s*$', open('openwrt/luci-app-nadkop/Makefile').read(), re.M)
          if m: ui = m.group(1) + '-r' + re.search(r'^PKG_RELEASE:=(\S+)\s*$', open('openwrt/luci-app-nadkop/Makefile').read(), re.M).group(1)
          nfqws_m = re.search(r'^PKG_VERSION:=(\S+)\s*$', open('openwrt/nadkop-nfqws/Makefile').read(), re.M)
          nfqws = (nfqws_m.group(1) + '-r' + re.search(r'^PKG_RELEASE:=(\S+)\s*$', open('openwrt/nadkop-nfqws/Makefile').read(), re.M).group(1)) if nfqws_m else 'unknown'
          src = open('scripts/get-nadkop.sh').read()
          src = re.sub(r'^CORE="\$\{NADKOP_CORE:-[^}]*\}"', 'CORE="${NADKOP_CORE:-' + core + '}"', src, flags=re.M)
          src = re.sub(r'^UI="\$\{NADKOP_UI:-[^}]*\}"', 'UI="${NADKOP_UI:-' + ui + '}"', src, flags=re.M)
          src = re.sub(r'^NFQWS="\$\{NADKOP_NFQWS:-[^}]*\}"', 'NFQWS="${NADKOP_NFQWS:-' + nfqws + '}"', src, flags=re.M)
          # Default BASE_URL becomes this release, so `sh get-nadkop.sh` works with no args.
          src = re.sub(r'^BASE_URL="\$\{1:-\}"', 'BASE_URL="${1:-' + base + '}"', src, flags=re.M)
          open('release/get-nadkop.sh', 'w').write(src)
          PY
          chmod +x release/get-nadkop.sh
          ( cd release && sha256sum -- * > sha256sums )
          ls -la release/
      - name: Release notes from CHANGELOG.md
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: |
          python3 - "$VER" > release/notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          lines = text.splitlines()
          heading = re.compile(r'^## .*LuCI ' + re.escape(ver) + r'(?:\s|$)')
          start = next((i for i, l in enumerate(lines) if heading.search(l)), None)
          if start is None:
              print(f'Nadkop {ver}. See CHANGELOG.md for details.')
          else:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
              print('\n'.join(lines[start:end]).strip())
          PY
          # shellcheck disable=SC2016
          printf '\n\n---\nFull history: CHANGELOG.md. One-line install from this release:\n```sh\nuclient-fetch -O /tmp/get-nadkop.sh %s/get-nadkop.sh && sh /tmp/get-nadkop.sh %s\n```\n' \
            "${{ needs.version.outputs.base_url }}" "${{ needs.version.outputs.base_url }}" >> release/notes.md
          cat release/notes.md
      - name: Create GitHub Release
        env:
          VER: ${{ needs.version.outputs.ver }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git fetch --no-tags origin "refs/tags/v$VER"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA" || {
            echo '::error::Release tag moved during the build. Refusing to publish stale artifacts.'
            exit 1
          }
          gh release create "v$VER" --verify-tag --title "v$VER" --notes-file release/notes.md \
            release/nadkop-linux-x86_64 release/nadkop-linux-aarch64 \
            release/*.apk release/*.ipk release/sha256sums \
            release/get-nadkop.sh release/install-openwrt.sh
